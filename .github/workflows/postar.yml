name: postar-instagram
on:
  schedule:
    - cron: '0 15 * * *'   # 12:00 BRT
    - cron: '30 16 * * *'  # 13:30 BRT retry (no-op se ja postou)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pillow
      - name: Postar no Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python postar_cloud.py
